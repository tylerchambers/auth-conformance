name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build and run all tests
        run: bun run test

      - name: Pack and test isolated consumer
        run: bun run test:package

      - name: Verify release tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./packages/conformance/package.json').version")"

      - name: Check whether this version is already published
        id: registry
        working-directory: packages/conformance
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "auth-conformance@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package with provenance
        if: steps.registry.outputs.published != 'true'
        working-directory: packages/conformance
        run: npm publish --access public --provenance
